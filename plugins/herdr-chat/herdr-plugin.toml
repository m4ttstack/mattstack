id = "m4ttstack.chat"
name = "Chat"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "rt chat where the agents live: broadcast, presence, jump-to-pane"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open-viewer"
title = "Open chat viewer"
contexts = ["workspace"]
command = ["target/release/herdr-chat", "open-viewer"]

[[actions]]
id = "broadcast"
title = "Broadcast to panes"
contexts = ["workspace"]
command = ["target/release/herdr-chat", "broadcast"]

[[actions]]
id = "peek"
title = "Chat peek"
contexts = ["workspace"]
command = ["target/release/herdr-chat", "peek"]

[[actions]]
id = "quick-send"
title = "Quick send"
contexts = ["workspace"]
command = ["target/release/herdr-chat", "quick-send"]

[[actions]]
id = "sign-in"
title = "Sign in to chat"
contexts = ["pane"]
command = ["target/release/herdr-chat", "sign-in"]

[[actions]]
id = "sign-out"
title = "Sign out of chat"
contexts = ["pane"]
command = ["target/release/herdr-chat", "sign-out"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/herdr-chat", "on-agent-detected"]

[[panes]]
id = "broadcast-ui"
title = "Broadcast"
placement = "popup"
width = "70%"
height = "60%"
command = ["target/release/herdr-chat", "broadcast", "--pane"]

[[panes]]
id = "peek-ui"
title = "Chat peek"
placement = "popup"
width = "70%"
height = "60%"
command = ["target/release/herdr-chat", "peek", "--pane"]

[[panes]]
id = "quick-send-ui"
title = "Quick send"
placement = "popup"
width = "70%"
height = "60%"
command = ["target/release/herdr-chat", "quick-send", "--pane"]

[[panes]]
id = "signin-ask"
title = "Sign in to chat?"
placement = "popup"
width = 66
height = 11
command = ["target/release/herdr-chat", "signin-ask"]
