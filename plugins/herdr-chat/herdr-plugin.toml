id = "m4ttstack.chat"
name = "Chat"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "rt chat where the agents live: broadcast, presence, jump-to-pane"
platforms = ["macos"]

# Runtime commands are wrapped in `sh -c "exec ./..."`: herdr's pane launcher
# resolves the command via a PATH search, so a bare relative path is not found;
# sh is on PATH and cwd is the plugin root, so the relative binary resolves.

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open-viewer"
title = "Open chat viewer"
contexts = ["workspace"]
command = ["sh", "-c", "exec ./target/release/herdr-chat open-viewer"]

[[actions]]
id = "broadcast"
title = "Broadcast to panes"
contexts = ["workspace"]
command = ["sh", "-c", "exec ./target/release/herdr-chat broadcast"]

[[actions]]
id = "peek"
title = "Chat peek"
contexts = ["workspace"]
command = ["sh", "-c", "exec ./target/release/herdr-chat peek"]

[[actions]]
id = "quick-send"
title = "Quick send"
contexts = ["workspace"]
command = ["sh", "-c", "exec ./target/release/herdr-chat quick-send"]

[[actions]]
id = "launcher"
title = "Chat launcher"
contexts = ["pane"]
command = ["sh", "-c", "exec ./target/release/herdr-chat launcher"]

[[actions]]
id = "sign-in"
title = "Sign in to chat"
contexts = ["pane"]
command = ["sh", "-c", "exec ./target/release/herdr-chat sign-in"]

[[actions]]
id = "sign-out"
title = "Sign out of chat"
contexts = ["pane"]
command = ["sh", "-c", "exec ./target/release/herdr-chat sign-out"]

[[panes]]
id = "broadcast-ui"
title = "Broadcast"
placement = "popup"
width = 92
height = 26
command = ["sh", "-c", "exec ./target/release/herdr-chat broadcast --pane"]

[[panes]]
id = "peek-ui"
title = "Chat peek"
placement = "popup"
width = 72
height = 20
command = ["sh", "-c", "exec ./target/release/herdr-chat peek --pane"]

[[panes]]
id = "quick-send-ui"
title = "Quick send"
placement = "popup"
width = 72
height = 18
command = ["sh", "-c", "exec ./target/release/herdr-chat quick-send --pane"]

[[panes]]
id = "launcher-ui"
title = "Chat"
placement = "popup"
width = 54
height = 12
command = ["sh", "-c", "exec ./target/release/herdr-chat launcher --pane"]
