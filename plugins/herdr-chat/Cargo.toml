[package]
name = "herdr-chat"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "herdr-chat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
