<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>mattstack</title>
    <style>
      :root { color-scheme: light dark; --bg: #0e0e11; --fg: #f4f4f5; --muted: #9d9da6; --accent: #e64980; font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
      @media (prefers-color-scheme: light) { :root { --bg: #fafafa; --fg: #17171c; --muted: #6b6b74; } }
      body { margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .mark { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
      .mark span { color: var(--accent); }
      p { color: var(--muted); line-height: 1.55; margin: 14px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">matt<span>stack</span></div>
      <p>A suite of agentic development tools built for you and your team.</p>
      <p>Coming soon.</p>
    </main>
  </body>
</html>
