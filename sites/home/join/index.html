<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Join mattstack</title>
    <meta name="description" content="Accept your mattstack team invite." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0e0e11;
        --fg: #f4f4f5;
        --muted: #9d9da6;
        --accent: #e64980;
        --accent-wash: rgba(230, 73, 128, 0.12);
        --card: #17171c;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Helvetica, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #17171c;
          --muted: #6b6b74;
          --card: #ffffff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 560px;
        width: 100%;
      }
      .mark {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      .mark span {
        color: var(--accent);
      }
      .hero-icon {
        border-radius: 24px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        margin-bottom: 18px;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 22px 0 8px;
      }
      p.tag {
        color: var(--muted);
        line-height: 1.55;
        margin: 0 0 28px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .dl,
      .primary {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        padding: 13px 22px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition:
          transform 0.1s ease,
          opacity 0.15s ease;
      }
      .dl {
        background: var(--accent);
        color: #fff;
      }
      .primary {
        background: var(--card);
        color: var(--fg);
        box-shadow: inset 0 0 0 1px var(--accent-wash);
      }
      .dl:hover,
      .primary:hover {
        transform: translateY(-1px);
      }
      .dl[aria-disabled="true"] {
        opacity: 0.55;
        pointer-events: none;
      }
      .meta,
      .status {
        color: var(--muted);
        /* Carries the copyable invite link; code strings stay mono. */
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        margin-top: 14px;
        line-height: 1.5;
        min-height: 1.2em;
        word-break: break-all;
      }
      .fine {
        margin-top: 40px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="hero-icon"
        src="/assets/app-icon.png"
        alt=""
        width="72"
        height="72"
      />
      <div class="mark">matt<span>stack</span></div>
      <h1 id="headline">Loading your invite...</h1>
      <p class="tag" id="subtext"></p>

      <div class="actions">
        <button class="primary" id="open" hidden>Open mattstack</button>
        <a
          class="dl"
          id="download"
          href="https://github.com/m4ttstack/mattstack/releases/latest"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download for Mac
        </a>
      </div>
      <div class="meta" id="meta">checking latest version...</div>
      <div class="status" id="status"></div>

      <p class="fine">Apple silicon, macOS 14+.</p>
    </main>

    <script src="/join/join.js"></script>
    <script src="/join/app.js"></script>
  </body>
</html>
