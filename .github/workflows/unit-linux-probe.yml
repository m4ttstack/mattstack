name: Unit suite on ubuntu (probe)

# A one-off reading of which unit tests actually need a Mac. The suite runs
# on the macOS shards because much of the tree is macOS-specific, but only
# a few dozen test files name launchd, plutil or ~/Library. This job runs
# the whole suite on ubuntu, never fails the PR, and uploads the failing
# file list; the shards move off macOS once that list is small and known.
# Advisory only: it is not part of the checks gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/unit-linux-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # zsh: rt shells out to /bin/zsh, which macOS always has; the first
      # probe lost 396 tests to its absence alone. The git identity is
      # what a developer's Mac has and the team-repo tests commit with.
      - name: Install what the suite assumes a Mac has
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age zstd git-lfs zsh
          git config --global user.name probe
          git config --global user.email probe@example.invalid
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit suite
        run: |
          start=$(date +%s)
          set +e
          bun run test > "$RUNNER_TEMP/unit.log" 2>&1
          status=$?
          set -e
          echo "exit=$status wall=$(( $(date +%s) - start ))s"
          # bun prints a file header (under GitHub Actions, "::group::<path>:")
          # and then its tests, so the file of a (fail) line is the header
          # before it. Failures are listed again in the summary, so the count
          # per file is deduplicated by test name.
          awk '/^(::group::)?[^ (].*\.test\.tsx?:$/ {f=$0; sub(/^::group::/,"",f); sub(/:$/,"",f)}
               /^\(fail\)/ {t=$0; sub(/ \[[0-9.]*ms\]$/,"",t); if (!seen[f t]++) n[f]++}
               END {for (k in n) printf "%d\t%s\n", n[k], k}' "$RUNNER_TEMP/unit.log" | sort -rn > "$RUNNER_TEMP/failing-files.tsv" || true
          grep -E '^(error|Error):|Unhandled|timed out' "$RUNNER_TEMP/unit.log" | sort | uniq -c | sort -rn | head -40 > "$RUNNER_TEMP/errors.txt" || true
          tail -5 "$RUNNER_TEMP/unit.log"
          echo "::group::failing files ($(wc -l < "$RUNNER_TEMP/failing-files.tsv")): failures, path"; cat "$RUNNER_TEMP/failing-files.tsv"; echo "::endgroup::"
          echo "::group::error lines"; cat "$RUNNER_TEMP/errors.txt"; echo "::endgroup::"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-linux-probe
          path: |
            ${{ runner.temp }}/unit.log
            ${{ runner.temp }}/failing-files.tsv
            ${{ runner.temp }}/errors.txt
          retention-days: 7
