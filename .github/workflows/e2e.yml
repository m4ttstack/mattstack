name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

# Same rule as checks.yml: superseded PR runs are cancelled, main runs never.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Which of this event's files can affect the e2e suite and what the pty
  # gate paints (scripts/ci/test-scope.ts; docs/ci.md has the table). Cheap
  # ubuntu job so the expensive macos ones below can be skipped outright. A
  # push to main runs both: main is what releases cut from. A PR checks out
  # refs/pull/N/merge, so HEAD^1..HEAD is exactly the PR's diff.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      glitter: ${{ steps.scope.outputs.glitter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun scripts/ci/test-scope.ts

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-termwright-${{ runner.os }}
          restore-keys: cargo-termwright-

      - name: Install Termwright
        run: |
          if ! command -v termwright &>/dev/null; then
            cargo install termwright
          fi

      - name: Build rt binary
        run: bun build --compile --no-compile-autoload-bunfig --no-compile-autoload-dotenv ./cli.ts --outfile dist/rt --define 'RT_VERSION="e2e-test"'

      - name: Codesign binary (ad-hoc with JIT entitlements)
        run: |
          codesign --remove-signature dist/rt
          codesign --force --sign - --entitlements scripts/entitlements.plist dist/rt

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          RT_BINARY: ${{ github.workspace }}/dist/rt

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: e2e/artifacts/
          retention-days: 7

  # The glitter pty gate drives the real rt-ui, so it needs Go and a helper
  # build the other e2e tests never touch. It is its own job so that cost
  # lands only on PRs that can actually break the board -- and so a run that
  # does not apply shows up as a skipped check rather than a silent pass.
  # GLITTER_TRIGGERS in scripts/ci/test-scope.ts lists what it paints from.
  glitter-pty:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.glitter == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-termwright-${{ runner.os }}
          restore-keys: cargo-termwright-

      - name: Install Termwright
        run: |
          if ! command -v termwright &>/dev/null; then
            cargo install termwright
          fi

      - name: Build rt binary
        run: bun build --compile --no-compile-autoload-bunfig --no-compile-autoload-dotenv ./cli.ts --outfile dist/rt --define 'RT_VERSION="e2e-test"'

      - name: Codesign binary (ad-hoc with JIT entitlements)
        run: |
          codesign --remove-signature dist/rt
          codesign --force --sign - --entitlements scripts/entitlements.plist dist/rt

      - name: Run the glitter pty gate
        run: bun run test:pty
        env:
          RT_BINARY: ${{ github.workspace }}/dist/rt

  # The check branch protection requires, named e2e. Without always(), a
  # failed changes job would skip e2e-tests, and a skipped required check
  # reads as passing; e2e-tests may skip only when changes said so.
  e2e:
    needs: [changes, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: e2e passed or did not apply
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.e2e-tests.result }}
          RUN: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes=$CHANGES e2e-tests=$TESTS run=$RUN"
          [ "$CHANGES" = success ] || { echo "changes did not succeed"; exit 1; }
          [ "$TESTS" = success ] && exit 0
          [ "$TESTS" = skipped ] && [ "$RUN" = false ] && exit 0
          echo "e2e-tests was $TESTS with run=$RUN"
          exit 1
