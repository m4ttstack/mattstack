name: Checks

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a PR supersedes its older run and frees its macOS slot;
# main runs are never cancelled, so every commit on main keeps its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this event's unit shards run: full, changed (--changed=HEAD^1) or
  # skip. On a pull request every job checks out refs/pull/N/merge, whose
  # first parent is the base tip, so HEAD^1..HEAD is exactly the PR's diff.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      dirs: ${{ steps.scope.outputs.dirs }}
      always: ${{ steps.scope.outputs.always }}
      plugins: ${{ steps.scope.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bun scripts/ci/test-scope.ts

  # Everything that does not need a Mac. A step that turns out to need one
  # moves to a static-macos job that runs on every PR, never into unit.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --frozen-lockfile passes a stale workspace package version, which every
      # worktree's ready-step install then rewrites and leaves as dirt.
      - name: Lockfile in sync
        run: bun install && git diff --exit-code -- bun.lock

      # A schema change that would invalidate stored settings needs a
      # storeVersion bump and a matching migrateFrom entry (a never-shipped
      # key may instead be acknowledged); the committed lock is the record.
      - name: Settings schema lock is in sync
        run: bun run cli.ts settings schema lock && git diff --exit-code -- packages/rt-client/src/settings/schema.lock.json

      # The checkout has full history but only names the ref it checked out,
      # so origin/main still needs an explicit fetch into its tracking ref.
      # The v* tags are fetched too: the latest release's lock says which
      # keys have shipped, and only a key that has not may skip a migration.
      - name: Settings schema changes are classified
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main '+refs/tags/v*:refs/tags/v*' && bun run cli.ts settings schema diff --against-ref origin/main

      # release.yml is grandfathered out of the lint: it carries pre-existing
      # shellcheck findings whose quoting is tangled with the release flow.
      # Lint it the day it is next edited, not from this gate.
      - name: Workflow lint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/checks.yml .github/workflows/e2e.yml .github/workflows/purity.yml .github/workflows/renovate.yml .github/workflows/timings.yml

      # A PR restores main's newest cache; main restores its own previous one.
      # Entries older than a week are dropped first or compiled binaries pile up.
      - uses: actions/cache@v4
        with:
          path: .git/turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: find .git/turbo-cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Apps and packages, plus rt's static gates (turbo)
        if: github.event_name == 'pull_request'
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/turbo.sh check --affected --concurrency=4 --output-logs=errors-only
      - name: Apps and packages, plus rt's static gates (turbo, main)
        if: github.event_name != 'pull_request'
        env:
          TURBO_TELEMETRY_DISABLED: "1"
        run: scripts/turbo.sh check --concurrency=4 --output-logs=errors-only

  # The Go helper's own vet + tests, plus the shared protocol fixtures both
  # languages golden-test (lib/ui/__tests__/protocol.test.ts runs in the unit
  # shards). Its own job: it is a minute of build time nothing else waits on.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod
          cache-dependency-path: ui/go.sum
      - name: rt-ui vet and tests
        run: bun run ui:test

  # deck supervises launchd and shells to plutil, both macOS-only, so its suite
  # runs here and nowhere else (scripts/turbo.sh drops it off macOS).
  deck-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .git/turbo-cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: find .git/turbo-cache -type f -mtime +7 -delete 2>/dev/null || true
      - if: github.event_name == 'pull_request'
        env:
          TURBO_TELEMETRY_DISABLED: "1"
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/turbo.sh test --filter=deck --affected --output-logs=errors-only
      - if: github.event_name != 'pull_request'
        env:
          TURBO_TELEMETRY_DISABLED: "1"
        run: scripts/turbo.sh test --filter=deck --output-logs=errors-only

  # macos-latest, matching e2e.yml: much of the tree is macOS-specific (launchd
  # labels, TCC, codesign, ~/Library paths) and the bunfig preload that isolates
  # HOME for tests is exercised the same way developers run it locally.
  unit:
    needs: scope
    if: needs.scope.outputs.mode != 'skip'
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install backup dependencies
        run: brew install age zstd git-lfs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The always-run guards read source as text, so --changed never selects
      # them; path arguments intersect with --changed, so they need their own
      # call, and one shard is enough.
      - name: Unit tests, shard ${{ matrix.shard }} of 3
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          DIRS: ${{ needs.scope.outputs.dirs }}
          ALWAYS: ${{ needs.scope.outputs.always }}
          SHARD: ${{ matrix.shard }}
        run: |
          # An empty list would make bun test run every file in the repo,
          # e2e included; fail loudly instead.
          [ -n "$DIRS" ] || { echo "scope produced no unit directories"; exit 1; }
          start=$(date +%s)
          changed=""
          if [ "$MODE" = changed ]; then changed="--changed=HEAD^1"; fi
          # shellcheck disable=SC2086
          bun test $DIRS --shard="$SHARD/3" --timings=test-timings.json $changed
          if [ "$MODE" = changed ] && [ "$SHARD" = 1 ]; then
            [ -n "$ALWAYS" ] || { echo "scope produced no always-run guards"; exit 1; }
            # shellcheck disable=SC2086
            bun test $ALWAYS
          fi
          echo "shard $SHARD: $(( $(date +%s) - start ))s ($MODE)"

  # herdr-chat is a Rust herdr plugin; build and test it only when its tree
  # changed (every push to main runs it). rt's unit shards never read it.
  # The comma wrap makes the match exact, so a sibling named herdr-chat-x
  # does not trigger it.
  plugin-herdr-chat:
    needs: scope
    if: contains(format(',{0},', needs.scope.outputs.plugins), ',plugins/herdr-chat,')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/herdr-chat/target
          key: cargo-${{ runner.os }}-${{ hashFiles('plugins/herdr-chat/Cargo.lock') }}-${{ github.sha }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Build and test herdr-chat
        working-directory: plugins/herdr-chat
        run: cargo build --release --locked && cargo test --locked

  # The skills pack's own checks, run in-tree when plugins/mattstack or the
  # rt MCP, skills or command-tree sources it reads changed (every push to
  # main runs them). --mattstack-dir names an empty root so
  # rt resolves plugins from it instead of `claude plugin list`. The comma
  # wrap makes the match exact, as for herdr-chat.
  plugin-mattstack:
    needs: scope
    if: contains(format(',{0},', needs.scope.outputs.plugins), ',plugins/mattstack,')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RT_SKIP_SETUP: "1"
      RT_BATCH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # A PR checkout is the merge commit, so HEAD^1 is the base branch tip,
      # the same base the scope job diffs against.
      - name: plugin.json version bumped
        if: github.event_name == 'pull_request'
        run: bun scripts/ci/plugin-version-bumped.ts --base HEAD^1 --plugin plugins/mattstack
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: Digraph checker cases
        run: bash plugins/mattstack/plugin/skills/process-digraphs/test-check-dot.sh
      - name: Every plugin digraph passes check-dot (warnings fail)
        working-directory: plugins/mattstack
        run: |
          set -o pipefail
          grep -rlE '^```dot[[:space:]]*$' --include='*.md' . | sort | xargs python3 plugin/skills/process-digraphs/check-dot.py
      - name: Certify every skill and attachment dir
        working-directory: plugins/mattstack
        run: |
          set -e
          for d in skills/*/ attachments/*/ attachments/*/*/; do
            [ -f "${d}SKILL.md" ] || continue
            sh tests/certify.sh "$d"
          done
      - name: skills check (compile drift and strict mcp lint)
        run: |
          mkdir -p "$RUNNER_TEMP/mattstack"
          bun cli.ts skills check --pack-dir "$GITHUB_WORKSPACE/plugins/mattstack" --mattstack-dir "$RUNNER_TEMP/mattstack" --strict
      - name: mcp-tools reference is current
        run: |
          set -o pipefail
          generated="$RUNNER_TEMP/mcp-tools-reference.md"
          bun cli.ts mcp tools --json | bun plugins/mattstack/scripts/gen-mcp-tools.ts > "$generated" || {
            echo "The reference generator failed (bun cli.ts mcp tools --json | bun plugins/mattstack/scripts/gen-mcp-tools.ts); see the error above."
            exit 1
          }
          cmp "$generated" plugins/mattstack/attachments/mcp-tools/reference.md || {
            echo "reference.md is stale. Regenerate: bun cli.ts mcp tools --json | bun plugins/mattstack/scripts/gen-mcp-tools.ts > plugins/mattstack/attachments/mcp-tools/reference.md"
            exit 1
          }

  # The job branch protection requires. Without always(), a failed scope
  # would skip unit and this job too, and a skipped required check reads as
  # passing on GitHub.
  checks:
    needs: [scope, static, go, deck-macos, unit, plugin-herdr-chat, plugin-mattstack]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          SCOPE: ${{ needs.scope.result }}
          STATIC: ${{ needs.static.result }}
          GO: ${{ needs.go.result }}
          DECK: ${{ needs.deck-macos.result }}
          UNIT: ${{ needs.unit.result }}
          HERDR_CHAT: ${{ needs.plugin-herdr-chat.result }}
          MATTSTACK: ${{ needs.plugin-mattstack.result }}
          MODE: ${{ needs.scope.outputs.mode }}
        run: |
          echo "scope=$SCOPE static=$STATIC go=$GO deck=$DECK unit=$UNIT herdr-chat=$HERDR_CHAT mattstack=$MATTSTACK mode=$MODE"
          [ "$SCOPE" = success ] || { echo "scope did not succeed"; exit 1; }
          [ "$STATIC" = success ] || { echo "static did not succeed"; exit 1; }
          [ "$GO" = success ] || { echo "go did not succeed"; exit 1; }
          [ "$DECK" = success ] || { echo "deck-macos did not succeed"; exit 1; }
          # skipped is the untouched case: a needed job whose if: is false.
          [ "$HERDR_CHAT" = success ] || [ "$HERDR_CHAT" = skipped ] || { echo "plugin-herdr-chat did not succeed"; exit 1; }
          [ "$MATTSTACK" = success ] || [ "$MATTSTACK" = skipped ] || { echo "plugin-mattstack did not succeed"; exit 1; }
          [ "$UNIT" = success ] && exit 0
          [ "$UNIT" = skipped ] && [ "$MODE" = skip ] && exit 0
          echo "unit was $UNIT with mode $MODE"
          exit 1
